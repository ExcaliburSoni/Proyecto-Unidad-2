<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="estilos.css">

</head>

<body>

    <div class="container py-4">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="text-center">

                    <img src="Imagenes/Logo de la pagina Web de la maestra Karen.png" class="logo">

                    <h1 class="titulo">
                        Speed of<br>Comics
                    </h1>

                </div>

                <form id="formRegistro">

                    <div class="mb-3">
                        <label style="color: rgb(203, 0, 0); font-weight: bold; font-size: 30px;">Nombre</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label style="color: rgb(203, 0, 0); font-weight: bold; font-size: 30px;">Apellidos</label>
                        <input type="text" id="apellidos" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label style="color: rgb(203, 0, 0); font-weight: bold; font-size: 30px;">Correo</label>
                        <input type="email" id="correo" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label style="color: rgb(203, 0, 0); font-weight: bold; font-size: 30px;">Contraseña</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label style="color: rgb(203, 0, 0); font-weight: bold; font-size: 30px;">Confirmar contraseña</label>
                        <input type="password" id="confirmar" class="form-control" required>
                    </div>

                    <div class="text-center">

                        <button class="btn cafe-btn" type="submit">

                            Registrarse

                        </button>

                    </div>

                </form>

                <div class="text-center mt-4">

                    <a href="index.html">

                        Volver al inicio

                    </a>

                </div>

            </div>

        </div>

    </div>

    <script src="storage.js"></script>
    <script src="registro.js"></script>

</body>

</html>
